<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/logo.svg" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PlateFix — the smallest fix for your plate</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Manrope:wght@500;600;700;800&display=swap"
    rel="stylesheet"
  />
  <!-- First-paint boot screen: pure HTML/CSS so there is never a white flash
       before the bundle loads. Removed by DismissBoot once React mounts. -->
  <style>
    #boot {
      position: fixed;
      inset: 0;
      z-index: 60;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      background:
        radial-gradient(1200px 500px at 85% -10%, rgba(246, 231, 207, 0.6), transparent 60%),
        radial-gradient(900px 420px at 0% 0%, rgba(63, 92, 63, 0.08), transparent 55%),
        #fbf9f4;
      color: #2b2420;
      font-family: "Inter", ui-sans-serif, system-ui, sans-serif;
      transition: opacity 0.45s ease;
    }
    #boot.boot-fade { opacity: 0; pointer-events: none; }
    .boot-name {
      margin: 0;
      font-family: "Manrope", "Inter", ui-sans-serif, system-ui, sans-serif;
      font-weight: 800;
      font-size: 22px;
      letter-spacing: -0.02em;
    }
    .boot-tag { margin: 0; font-size: 13px; color: rgba(43, 36, 32, 0.6); }
    .boot-steam {
      stroke: #3f5c3f;
      stroke-width: 2.5;
      stroke-linecap: round;
      fill: none;
      opacity: 0;
      animation: boot-steam 1.7s ease-in-out infinite;
    }
    .boot-steam.s2 { animation-delay: 0.45s; }
    .boot-steam.s3 { animation-delay: 0.9s; }
    @keyframes boot-steam {
      0% { opacity: 0; transform: translateY(4px); }
      40% { opacity: 0.85; }
      100% { opacity: 0; transform: translateY(-6px); }
    }
    .boot-bar {
      width: 180px;
      height: 4px;
      border-radius: 999px;
      background: rgba(43, 36, 32, 0.08);
      overflow: hidden;
    }
    .boot-bar span {
      display: block;
      height: 100%;
      width: 42%;
      border-radius: 999px;
      background: linear-gradient(90deg, #3f5c3f, #d98e2b);
      animation: boot-slide 1.2s ease-in-out infinite;
    }
    @keyframes boot-slide {
      0% { transform: translateX(-110%); }
      100% { transform: translateX(330%); }
    }
  </style>
</head>


<body>
  <div id="root"></div>
  <div id="boot" role="status" aria-label="PlateFix is loading">
    <svg width="56" height="56" viewBox="0 0 48 48" aria-hidden="true">
      <path class="boot-steam s1" d="M18 13c0-3 3-3 3-6" />
      <path class="boot-steam s2" d="M24 12c0-3 3-3 3-6" />
      <path class="boot-steam s3" d="M30 13c0-3 3-3 3-6" />
      <rect x="11" y="22" width="26" height="15" rx="5" fill="#3f5c3f" />
      <path d="M8 25.5h3.5M36.5 25.5H40" stroke="#3f5c3f" stroke-width="3" stroke-linecap="round" />
      <rect x="15" y="18.5" width="18" height="4.5" rx="2.25" fill="#2b2420" />
      <circle cx="24" cy="17" r="2" fill="#d98e2b" />
    </svg>
    <p class="boot-name">PlateFix</p>
    <p class="boot-tag">finding the smallest fix for your plate</p>
    <div class="boot-bar"><span></span></div>
  </div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
